server:
  port: ${SERVER_PORT:8090}

spring:
  datasource:
    url: ${AGENT_PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/agent_platform}
    username: ${AGENT_PLATFORM_DB_USERNAME:postgres}
    password: ${agent.platform.database.password:${AGENT_PLATFORM_DB_PASSWORD}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    # 兼容已手工创建 V1 表结构、但尚未纳入 Flyway 管理的本地数据库。
    baseline-on-migrate: true
    baseline-version: 1

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    try-it-out-enabled: true
