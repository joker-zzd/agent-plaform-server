server:
  port: 8090

spring:
  application:
    name: agent-platform

  datasource:
    url: ${AGENT_PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/agent_platform}
    username: ${AGENT_PLATFORM_DB_USERNAME:postgres}
    password: ${AGENT_PLATFORM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: agent-platform-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  ai:
    openai:
      # 密钥只从环境变量读取，禁止将真实密钥提交到仓库。
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_MODEL:gpt-4o-mini}

agent:
  platform:
    model:
      # 平台模型标识，后续用于多模型路由配置。
      default-model: default-model

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
