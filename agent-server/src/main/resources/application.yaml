spring:
  application:
    name: agent-platform
  profiles:
    # 未显式指定环境时使用开发环境，可通过 SPRING_PROFILES_ACTIVE 覆盖。
    default: dev
  config:
    # 本机私密配置位于仓库外，避免密码进入 Git。
    import: optional:file:${user.home}/.agent-platform/application-local.properties

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: agent-platform-pool
      connection-timeout: 30000

  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true

  ai:
    openai:
      # 密钥只从环境变量或仓库外的本机配置读取。
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_MODEL:gpt-4o-mini}

agent:
  platform:
    persistence:
      # 默认使用数据库持久化实现；本地演示时可设置为 memory。
      type: ${AGENT_PLATFORM_PERSISTENCE_TYPE:jdbc}
    model:
      # 平台模型标识，后续用于多模型路由配置。
      default-model: default-model

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
